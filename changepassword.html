<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="css/mini-bootstrap.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/mobile.css" rel="stylesheet">
    <link href="css/notifmodal.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/topbar.css">

    <script>
        /* SCRIPT ANTI-GLITCH : S'exécute avant le chargement du body */
        (function() {
            try {
                const roles = JSON.parse(localStorage.getItem('roles') || '[]');
                const rolesArray = Array.isArray(roles) ? roles.map(r => r.toLowerCase()) : [roles.toLowerCase()];
                
                if (rolesArray.includes('particulier') && !rolesArray.includes('admin') && !rolesArray.includes('agent')) {
                    const style = document.createElement('style');
                    style.innerHTML = '[data-nav="transactions"] { display: none !important; }';
                    document.head.appendChild(style);
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo" id="sidebarRoleLabel">📊 -</span>
      <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
        <span class="toggle-bar"></span><span class="toggle-bar"></span><span class="toggle-bar"></span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" id="nav-dashboard"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a>
      <a href="transactions.html" data-nav="transactions"><span class="nav-icon">📊</span><span class="nav-text">Transactions</span></a>
      <a href="notifications.html"><span class="nav-icon">🔔</span><span class="nav-text">Notifications</span></a>
      <a class="active" href="changepassword.html"><span class="nav-icon">⚙️</span><span class="nav-text">Change Password</span></a>
      <a href="index.html"><span class="nav-icon">💳</span><span class="nav-text">Acceuille</span></a>
    </nav>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
  <main class="main">
    <header class="topbar">
      <button id="mobileMenuToggle" class="mobile-menu-btn">
        <span></span><span></span><span></span>
      </button>
      <h1>Change Password</h1>
      <div class="user" id="topbarUser">
        <button>
            <span id="userNameDisplay">John Doe</span> 
            <i class="fa fa-user" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <section class="content">
      <div class="box change-box" style="max-width:820px;margin:0 auto;">
        <h3>Change your password</h3>
        <p class="muted">Choose a strong password to keep your account secure.</p>
        
        <form id="changePasswordForm" class="change-form" onsubmit="handleChange(event); return false;">
            <div class="form-row">
                <label for="currentPassword">Current password</label>
                <div class="input-with-toggle">
                  <input id="currentPassword" type="password" required placeholder="Enter current password">
                  <button type="button" class="toggle-pass" data-target="currentPassword">👁️</button>
                </div>
            </div>

            <div class="form-row">
                <label for="newPassword">New password</label>
                <div class="input-with-toggle">
                  <input id="newPassword" type="password" required placeholder="At least 8 characters">
                  <button type="button" class="toggle-pass" data-target="newPassword">👁️</button>
                </div>
                <div class="pw-meter">
                    <div id="pwStrength" class="pw-bar"></div>
                    <small id="pwHint" class="muted">Use upper/lower letters, numbers and symbols.</small>
                </div>
            </div>

            <div class="form-row">
                <label for="confirmPassword">Confirm new password</label>
                <div class="input-with-toggle">
                  <input id="confirmPassword" type="password" required placeholder="Repeat new password">
                  <button type="button" class="toggle-pass" data-target="confirmPassword">👁️</button>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update password</button>
                <button type="button" class="btn btn-outline" onclick="resetForm()">Reset</button>
            </div>
            <div id="formMessage" style="margin-top:12px;"></div>
        </form>
      </div>
    </section>
  </main>

  <style>
    .change-box { background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .form-row { margin-bottom:14px; }
    .form-row label { display:block; font-weight:600; margin-bottom:8px; color:#0f172a; }
    .input-with-toggle { display:flex; gap:8px; }
    .input-with-toggle input { flex:1; padding:10px; border-radius:10px; border:1px solid #e2e8f0; }
    .toggle-pass { background:#f1f5f9; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; }
    .pw-bar { height:8px; border-radius:8px; background:#e2e8f0; margin-top:8px; transition: all 0.3s; }
    .pw-bar.weak { background:#ef4444; width:33%; }
    .pw-bar.medium { background:#f59e0b; width:66%; }
    .pw-bar.strong { background:#10b981; width:100%; }
    .btn { padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; border: none; }
    .btn-outline { background: transparent; border: 1px solid #e2e8f0; }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 1. GESTION DU NOM UTILISATEUR ---
        const nameDisplay = document.getElementById('userNameDisplay');
        try {
            const userData = localStorage.getItem('authUser');
            if (userData) {
                const user = JSON.parse(userData);
                const displayName = user.nom || user.name || user.username || user.firstName;
                if (displayName) nameDisplay.textContent = displayName;
            }
        } catch (e) { console.error("Erreur nom", e); }

        // --- 2. GESTION DES RÔLES ET DASHBOARD ---
        const navDashboard = document.getElementById('nav-dashboard');
        const navTransactions = document.querySelector('[data-nav="transactions"]');
        try {
            const rawRoles = localStorage.getItem('roles');
            if (rawRoles) {
                const roles = JSON.parse(rawRoles);
                const rolesArray = Array.isArray(roles) ? roles.map(r => r.toLowerCase()) : [roles.toLowerCase()];
                
                if (rolesArray.includes('particulier') && !rolesArray.includes('admin') && !rolesArray.includes('agent')) {
                    if (navDashboard) navDashboard.setAttribute('href', 'dashboardp.html');
                    if (navTransactions) navTransactions.style.display = 'none';
                } else {
                    if (navDashboard) navDashboard.setAttribute('href', 'dashboard.html');
                }
            }
        } catch (e) { console.error("Erreur rôles", e); }

        // --- 3. FORCE DU MOT DE PASSE ---
        const newPw = document.getElementById('newPassword');
        const strength = document.getElementById('pwStrength');
        const hint = document.getElementById('pwHint');

        if (newPw) {
            newPw.addEventListener('input', function() {
                const val = newPw.value;
                let score = 0;
                if (val.length >= 8) score++;
                if (/[A-Z]/.test(val)) score++;
                if (/[0-9]/.test(val)) score++;
                if (/[^A-Za-z0-9]/.test(val)) score++;

                strength.className = 'pw-bar';
                if (score <= 1) { strength.classList.add('weak'); hint.textContent = 'Trop faible'; }
                else if (score === 2) { strength.classList.add('medium'); hint.textContent = 'Peut mieux faire'; }
                else { strength.classList.add('strong'); hint.textContent = 'Mot de passe robuste'; }
            });
        }
    });

    // --- 4. VISIBILITÉ MOT DE PASSE ---
    document.querySelectorAll('.toggle-pass').forEach(btn => {
        btn.onclick = () => {
            const input = document.getElementById(btn.dataset.target);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        };
    });

    // --- 5. ENVOI DU FORMULAIRE ---
    async function handleChange(e) {
        e.preventDefault();
        const cur = document.getElementById('currentPassword').value;
        const nw = document.getElementById('newPassword').value;
        const cf = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('formMessage');

        if (nw !== cf) {
            msg.textContent = 'Les mots de passe ne correspondent pas.';
            msg.style.color = '#ef4444';
            return;
        }

        // Récupération ID utilisateur
        let idUser = 0;
        try {
            const u = JSON.parse(localStorage.getItem('authUser'));
            idUser = u.id || u.userId || u.numero;
        } catch(e) {}

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;

        try {
            const res = await fetch('http://192.168.10.8:7071/api/wifi/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idUser, currentPassword: cur, newPassword: nw })
            });
            const data = await res.json();
            if (res.ok) {
                msg.textContent = 'Mot de passe mis à jour !';
                msg.style.color = '#059669';
                e.target.reset();
            } else {
                msg.textContent = data.message || 'Erreur lors de la mise à jour.';
                msg.style.color = '#ef4444';
            }
        } catch (err) {
            msg.textContent = 'Erreur réseau.';
            msg.style.color = '#ef4444';
        }
        btn.disabled = false;
    }

    function resetForm() {
        document.getElementById('changePasswordForm').reset();
        document.getElementById('formMessage').textContent = '';
        document.getElementById('pwStrength').className = 'pw-bar';
    }

    // --- 6. SIDEBAR TOGGLE ---
    (function(){
        const body = document.body;
        const toggle = document.getElementById('sidebarToggle');
        const mobileToggle = document.getElementById('mobileMenuToggle');
        const overlay = document.getElementById('sidebarOverlay');
        
        const toggleSidebar = () => {
            if (window.innerWidth <= 900) body.classList.toggle('sidebar-open');
            else body.classList.toggle('sidebar-collapsed');
        };

        if (toggle) toggle.onclick = toggleSidebar;
        if (mobileToggle) mobileToggle.onclick = toggleSidebar;
        if (overlay) overlay.onclick = () => body.classList.remove('sidebar-open');
    })();
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
